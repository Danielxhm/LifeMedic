<ion-content [fullscreen]="true" class="subpage-content">
  <div class="subpage-container">
    <header class="subpage-header">
      <button
        type="button"
        class="subpage-back-btn"
        aria-label="Volver a perfil"
        (click)="goBack()"
      >
        <hugeicons-icon
          [icon]="ArrowLeft02Icon"
          [size]="20"
          [strokeWidth]="2"
          color="currentColor"
          aria-hidden="true"
        ></hugeicons-icon>
      </button>
    </header>

    <div class="subpage-titles">
      <h1 class="subpage-title">Cambiar contraseña</h1>
      <p class="subpage-subtitle">
        Actualiza la contraseña de tu cuenta a continuación
      </p>
    </div>

    <form class="subpage-form" (ngSubmit)="onSubmit()" novalidate>
      <div class="subpage-fields">
        <div class="sub-field-group">
          <label class="sub-field-label" for="new-password">Nueva Contraseña</label>
          <div
            class="sub-field-box"
            [class.sub-field-box--invalid]="submitted && newPassword.length < 6"
          >
            <span class="sub-field-icon" aria-hidden="true">
              <hugeicons-icon
                [icon]="SquareLock02Icon"
                [size]="18"
                [strokeWidth]="1.8"
                color="currentColor"
              ></hugeicons-icon>
            </span>
            <input
              id="new-password"
              name="newPassword"
              [type]="showNewPassword ? 'text' : 'password'"
              class="sub-field-input"
              placeholder="••••••"
              [(ngModel)]="newPassword"
              autocomplete="new-password"
              required
            />
            <button
              type="button"
              class="sub-field-toggle"
              [attr.aria-label]="showNewPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              (click)="showNewPassword = !showNewPassword"
            >
              <hugeicons-icon
                [icon]="showNewPassword ? ViewIcon : ViewOffSlashIcon"
                [size]="18"
                [strokeWidth]="1.8"
                color="currentColor"
                aria-hidden="true"
              ></hugeicons-icon>
            </button>
          </div>
        </div>

        <div class="sub-field-group">
          <label class="sub-field-label" for="confirm-password">Confirmar Contraseña</label>
          <div
            class="sub-field-box"
            [class.sub-field-box--invalid]="submitted && newPassword !== confirmPassword"
          >
            <span class="sub-field-icon" aria-hidden="true">
              <hugeicons-icon
                [icon]="SquareLock02Icon"
                [size]="18"
                [strokeWidth]="1.8"
                color="currentColor"
              ></hugeicons-icon>
            </span>
            <input
              id="confirm-password"
              name="confirmPassword"
              [type]="showConfirmPassword ? 'text' : 'password'"
              class="sub-field-input"
              placeholder="••••••"
              [(ngModel)]="confirmPassword"
              autocomplete="new-password"
              required
            />
            <button
              type="button"
              class="sub-field-toggle"
              [attr.aria-label]="showConfirmPassword ? 'Ocultar confirmación' : 'Mostrar confirmación'"
              (click)="showConfirmPassword = !showConfirmPassword"
            >
              <hugeicons-icon
                [icon]="showConfirmPassword ? ViewIcon : ViewOffSlashIcon"
                [size]="18"
                [strokeWidth]="1.8"
                color="currentColor"
                aria-hidden="true"
              ></hugeicons-icon>
            </button>
          </div>
        </div>
      </div>

      @if (errorMessage) {
        <div class="subpage-error" role="alert">
          {{ errorMessage }}
        </div>
      }

      <div class="subpage-spacer"></div>

      <button type="submit" class="subpage-submit-btn">
        Establecer contraseña
      </button>
    </form>
  </div>
</ion-content>
