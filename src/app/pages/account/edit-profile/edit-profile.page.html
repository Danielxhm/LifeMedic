<ion-content [fullscreen]="true" class="subpage-content">
  <div class="subpage-container">
    <header class="subpage-header">
      <button
        type="button"
        class="subpage-back-btn"
        aria-label="Volver a perfil"
        (click)="goBack()"
      >
        <hugeicons-icon
          [icon]="ArrowLeft02Icon"
          [size]="20"
          [strokeWidth]="2"
          color="currentColor"
          aria-hidden="true"
        ></hugeicons-icon>
      </button>
    </header>

    <div class="subpage-titles">
      <h1 class="subpage-title">Editar datos</h1>
      <p class="subpage-subtitle">
        Cambia los datos de envío de tus medicamentos para hacerlos llegar
      </p>
    </div>

    <form class="subpage-form" (ngSubmit)="onSubmit()" novalidate>
      <div class="subpage-fields">
        <div class="sub-field-group">
          <label class="sub-field-label" for="edit-first-name">Nombre</label>
          <div
            class="sub-field-box"
            [class.sub-field-box--invalid]="submitted && !firstName.trim()"
          >
            <input
              id="edit-first-name"
              name="firstName"
              type="text"
              class="sub-field-input"
              placeholder="Tatiana"
              [(ngModel)]="firstName"
              autocomplete="given-name"
              required
            />
          </div>
        </div>

        <div class="sub-field-group">
          <label class="sub-field-label" for="edit-last-name">Apellido</label>
          <div
            class="sub-field-box"
            [class.sub-field-box--invalid]="submitted && !lastName.trim()"
          >
            <input
              id="edit-last-name"
              name="lastName"
              type="text"
              class="sub-field-input"
              placeholder="Ayala"
              [(ngModel)]="lastName"
              autocomplete="family-name"
              required
            />
          </div>
        </div>

        <div class="sub-field-group">
          <label class="sub-field-label" for="edit-street">Dirección de entrega</label>
          <div
            class="sub-field-box"
            [class.sub-field-box--invalid]="submitted && !street.trim()"
          >
            <input
              id="edit-street"
              name="street"
              type="text"
              class="sub-field-input"
              placeholder="Ej. Calle 123, Piso 4"
              [(ngModel)]="street"
              autocomplete="street-address"
              required
            />
          </div>
        </div>

        <div class="sub-field-group">
          <label class="sub-field-label" for="edit-municipality">Municipio</label>
          <div
            class="sub-field-box"
            [class.sub-field-box--invalid]="submitted && !municipality.trim()"
          >
            <input
              id="edit-municipality"
              name="municipality"
              type="text"
              class="sub-field-input"
              placeholder="Santa Tecla"
              [(ngModel)]="municipality"
              required
            />
          </div>
        </div>

        <div class="sub-field-group">
          <label class="sub-field-label" for="edit-city">Ciudad</label>
          <div
            class="sub-field-box"
            [class.sub-field-box--invalid]="submitted && !city.trim()"
          >
            <input
              id="edit-city"
              name="city"
              type="text"
              class="sub-field-input"
              placeholder="San Salvador"
              [(ngModel)]="city"
              autocomplete="address-level2"
              required
            />
          </div>
        </div>
      </div>

      @if (errorMessage) {
        <div class="subpage-error" role="alert">
          {{ errorMessage }}
        </div>
      }

      <div class="subpage-spacer"></div>

      <button type="submit" class="subpage-submit-btn">
        Guardar cambios
      </button>
    </form>
  </div>
</ion-content>
