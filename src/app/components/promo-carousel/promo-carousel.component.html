<swiper-container
  class="promo-swiper"
  slides-per-view="auto"
  space-between="12"
  autoplay-delay="4000"
  autoplay-disable-on-interaction="false"
>
  @for (promotion of promotions; track promotion.id) {
    <swiper-slide>
      <article
        class="promotion"
        [style.background]="promotion.gradient"
        [style.color]="promotion.textColor"
        (click)="onPromotionClick()"
      >
        <div class="promotion__content">
          <p class="promotion__brand">{{ promotion.brand }}</p>

          <h2 class="promotion__title">{{ promotion.title }}</h2>

          <p class="promotion__description">
            {{ promotion.description }}
          </p>

          <button
            class="promotion__button"
            type="button"
            [style.background-color]="promotion.buttonBg"
            [style.color]="promotion.buttonColor"
          >
            {{ promotion.action }}
          </button>
        </div>

        <div class="promotion__image-wrap">
          <img
            class="promotion__image"
            [src]="promotion.image"
            [alt]="promotion.title"
            loading="lazy"
          />
        </div>
      </article>
    </swiper-slide>
  }
</swiper-container>
