  <a
    class="bottom-nav__item"
    routerLink="/home"
    routerLinkActive="bottom-nav__item--active"
    [routerLinkActiveOptions]="{ exact: true }"
    (click)="onNavClick($event)"
  >
    <hugeicons-icon
      [icon]="Home01Icon"
      [size]="20"
      [strokeWidth]="1.8"
      color="currentColor"
      aria-hidden="true"
    ></hugeicons-icon>

  <a
    class="bottom-nav__item"
    routerLink="/products"
    routerLinkActive="bottom-nav__item--active"

      [icon]="GridViewIcon"
      [size]="20"
      [strokeWidth]="1.8"
      color="currentColor"
      aria-hidden="true"
    ></hugeicons-icon>

  <a
    class="bottom-nav__item"
    routerLink="/account"
    routerLinkActive="bottom-nav__item--active"
