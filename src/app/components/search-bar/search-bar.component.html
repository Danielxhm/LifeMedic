<div class="search-bar" role="search">
  <hugeicons-icon
    class="search-bar__icon"
    [icon]="Search01Icon"
    [size]="18"
    [strokeWidth]="1.8"
    color="currentColor"
    aria-hidden="true"
  ></hugeicons-icon>

  <input
    class="search-bar__input"
    type="search"
    placeholder="Acetaminofen"
    aria-label="Buscar productos"
    [value]="query"
    (input)="onInput($event)"
  />
</div>
