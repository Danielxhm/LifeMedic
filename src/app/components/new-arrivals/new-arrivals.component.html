<section class="new-arrivals">
  <header class="new-arrivals__header">
    <div class="new-arrivals__title-group">
      <span class="new-arrivals__eyebrow">RECIÉN LLEGADOS</span>
      <h2>Novedades</h2>
    </div>

    <button
      class="new-arrivals__view-all"
      type="button"
      (click)="viewAll()"
    >
      Ver todo
    </button>
  </header>

  <div class="new-arrivals__grid">
    @for (product of newestProducts; track product.id) {
      <app-product-card
        [product]="product"
        (favoriteToggled)="toggleFavorite($event)"
        (addedToCart)="addToCart($event)"
      ></app-product-card>
    }
  </div>
</section>
