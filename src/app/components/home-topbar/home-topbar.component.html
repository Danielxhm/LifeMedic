<header class="home-topbar">
  <span class="home-topbar__brand">LifeMedic</span>

  <button
    class="home-topbar__cart"
    type="button"
    [attr.aria-label]="'Carrito, ' + cartCount + ' productos'"
    (click)="goToCart()"
  >
    <hugeicons-icon
      [icon]="ShoppingBag01Icon"
      [size]="20"
      [strokeWidth]="1.7"
      color="currentColor"
    ></hugeicons-icon>

    @if (cartCount > 0) {
      <span class="home-topbar__badge">{{ cartCount }}</span>
    }
  </button>
</header>
